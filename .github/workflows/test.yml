name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobqueue
          POSTGRES_PASSWORD: jobqueue
          POSTGRES_DB: jobqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobqueue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://jobqueue:jobqueue@localhost:5432/jobqueue_test
        run: PYTHONPATH=src:. pytest tests/ -v --tb=short -x
